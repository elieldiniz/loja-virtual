services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orvalha
      POSTGRES_PASSWORD: orvalha
      POSTGRES_DB: orvalha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
