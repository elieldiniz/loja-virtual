name: Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orvalha
          POSTGRES_PASSWORD: orvalha
          POSTGRES_DB: orvalha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orvalha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    name: PHP 8.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Execute tests
        run: php artisan test
